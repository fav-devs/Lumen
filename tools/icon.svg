    <rect x="207" y="540" width="98" height="82" rx="20"/><rect x="331" y="540" width="98" height="82" rx="20"/><rect x="455" y="540" width="98" height="82" rx="20"/><rect x="579" y="540" width="98" height="82" rx="20"/><rect x="703" y="540" width="98" height="82" rx="20"/>
    <rect x="207" y="650" width="98" height="82" rx="20"/><rect x="331" y="650" width="98" height="82" rx="20"/><rect x="579" y="650" width="98" height="82" rx="20"/><rect x="703" y="650" width="98" height="82" rx="20"/>
  </g>
